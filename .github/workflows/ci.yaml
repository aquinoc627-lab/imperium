name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# The product gate is `just v0` plus clippy on workspace members.
# Do not add frontend / daemon / nextest-workspace / Sigstore jobs here.
# Those surfaces are not workspace members.

jobs:
  v0:
    name: just v0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: TypeScript reference kernel
        run: node --experimental-strip-types --test src/*.test.ts
        working-directory: web/v0
      - name: Clippy (workspace members only)
        run: cargo clippy -p imperium-core -p imperium-store -p imperium-cli --all-targets -- -D warnings
      - name: Rust tests
        run: |
          cargo test -p imperium-core --lib
          cargo test -p imperium-store
          cargo test -p imperium-cli
      - name: CLI smoke
        run: bash scripts/v0-smoke.sh
