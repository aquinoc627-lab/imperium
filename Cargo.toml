[workspace]
resolver = "2"
members = [
    "crates/imperium-core",
    "crates/imperium-runtime",
    "crates/imperium-store",
    "crates/imperium-sync",
    "crates/imperium-policy",
    "crates/imperium-cli",
    "crates/imperium-daemon",
    "crates/imperium-voice",
    "crates/imperium-crypto",
    "crates/imperium-ffi",
]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
postcard = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.0", features = ["full", "tracing"] }
anyhow = "1.0"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde", "postcard"] }
ulid = "1.0"

# Crypto
ring = "0.17"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1.0"
secrecy = "0.10"

# Storage
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
rusqlite = { version = "0.30", features = ["bundled", "modern_sqlite", "serde_json", "uuid", "chrono"] }
redb = "0.23"

# WASM
wasmtime = { version = "24.0", features = ["component-model-async", "wasi-preview2"] }
wasi-capabilities = "0.1"

# Policy
opa-wasm = "0.4"
rego = "0.12"

# Network
tonic = "0.10"
prost = "0.12"
libp2p = { version = "0.53", features = ["tcp", "yamux", "noise", "dns", "webtransport", "webrtc", "identify", "ping", "kad", "gossipsub", "mdns", "relay", "autonat"] }
libp2p-webrtc = "0.53"

# CLI
clap = { version = "4.5", features = ["derive", "env", "help", "usage", "color", "suggestions"] }
indicatif = "0.17"
colored = "2.0"
inquire = "0.7"

# Config
config = "0.14"
toml = "0.8"
dirs = "5.0"

# Bench
criterion = "0.5"

[workspace.lints.rust]
warn = [
    "unused_crate_dependencies",
    "unused_import_braces",
    "unused_lifetimes",
    "unused_qualifications",
    "variant_size_differences",
]
deny = [
    "unreachable_pub",
    "missing_debug_implementations",
    "missing_copy_implementations",
    "trivial_casts",
    "trivial_numeric_casts",
    "unused_allocation",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false