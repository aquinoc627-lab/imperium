[workspace]
resolver = "2"
# Working product only. Other crate dirs may still exist on disk as
# inert scaffolding; they are not members and must not gain workspace deps.
members = [
    "crates/imperium-core",
    "crates/imperium-cli",
    "crates/imperium-store",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
ulid = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
zeroize = "1.0"
secrecy = "0.10"
rusqlite = { version = "0.30", features = ["bundled", "modern_sqlite", "serde_json", "uuid", "chrono"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
clap = { version = "4.5", features = ["derive", "env", "help", "usage", "color", "suggestions"] }

[workspace.lints.rust]
unused_qualifications = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
