[package]
name = "imperium-cli"
version = "0.1.0-dev"
edition = "2021"
license = "BSL-1.0"
description = "IMPERIUM command-line interface"
repository = "https://github.com/aquinoc627-lab/imperium"

[[bin]]
name = "imperium-cli"
path = "src/main.rs"

[dependencies]
imperium-core = { path = "../imperium-core" }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
