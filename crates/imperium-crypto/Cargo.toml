[package]
name = "imperium-crypto"
version = "0.1.0-dev"
edition = "2021"
license = "BSL-1.0"
description = "Cryptographic operations: signing, encryption, key management"
repository = "https://github.com/yourorg/imperium"

[dependencies]
imperium-core = { path = "../imperium-core" }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
secrecy = { workspace = true }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.5"
rand_core = { workspace = true, features = ["os_rng"] }
serde = { workspace = true }
postcard = { workspace = true }