[package]
name = "imperium-daemon"
version = "0.1.0-dev"
edition = "2021"
license = "BSL-1.0"
description = "IMPERIUM background daemon (gRPC + HTTP)"
repository = "https://github.com/yourorg/imperium"

[[bin]]
name = "imperium-daemon"
path = "src/main.rs"

[dependencies]
imperium-core = { path = "../imperium-core" }
imperium-runtime = { path = "../imperium-runtime" }
imperium-store = { path = "../imperium-store" }
imperium-sync = { path = "../imperium-sync" }
imperium-policy = { path = "../imperium-policy" }
imperium-voice = { path = "../imperium-voice" }
imperium-crypto = { path = "../imperium-crypto" }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
config = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }