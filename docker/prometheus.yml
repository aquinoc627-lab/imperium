global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'imperium-dev'
    environment: 'development'

scrape_configs:
  - job_name: 'imperium-daemon'
    static_configs:
      - targets: ['imperium-daemon:8080']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

rule_files: []

alerting:
  alertmanagers:
    - static_configs:
        - targets: []