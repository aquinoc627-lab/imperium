[project]
name = "imperium"
version = "0.1.0-dev"
description = "IMPERIUM Python Components"
readme = "README.md"
license = {text = "BSL-1.0"}
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "redis>=5.0",
    "httpx>=0.27",
    "openapi-pydantic>=1.24",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "structlog>=24.1",
    "tenacity>=8.2",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "hypothesis>=6.100",
    "faker>=25.0",
    "jsonschema>=4.21",
]
ml = [
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "sentence-transformers>=5.7.0",
    "scikit-learn>=1.9.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "doWhy>=0.11",
    "pyro-ppl>=1.8",
]
sim = [
    "mesa>=3.0",
    "networkx>=3.2",
    "simpy>=4.0",
]
synth = [
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "black>=24.0",
    "isort>=5.13",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "RUF", "T20", "ARG", "SIM", "RET", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "TCH", "ASYNC", "LOG", "FAST"]
ignore = ["S101", "S106", "S311", "T201", "T203", "B008", "B009", "ARG001", "ARG002"]
fixable = ["ALL"]
unfixable = ["T201", "T203", "S101", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
bench_min_time = 1.0
bench_max_time = 5.0

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
