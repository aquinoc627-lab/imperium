<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IMPERIUM · workbench</title>
<style>
:root{
  --bg:#050508;--fg:#e8e6e1;--muted:#8b8a86;--subtle:#5c5b58;
  --line:#1c1c22;--panel:#0b0b10;--accent:#8b7cff;--deny:#c45c5c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
body{min-height:100vh}
header{display:flex;justify-content:space-between;align-items:baseline;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
header strong{letter-spacing:.18em;font-size:.72rem;font-weight:600}
header span{color:var(--muted);font:0.72rem var(--mono)}
main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(340px,1.4fr) minmax(220px,.8fr);gap:0;min-height:calc(100vh - 52px)}
section{padding:1.1rem 1.2rem;border-right:1px solid var(--line)}
section:last-child{border-right:0}
h2{margin:0 0 .7rem;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
label{display:block;font:0.68rem var(--mono);color:var(--subtle);margin:0 0 .35rem}
textarea{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:0;padding:.6rem .7rem;font:12px/1.4 var(--mono);min-height:7.2rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.65rem 0}
button{background:transparent;color:var(--fg);border:1px solid var(--line);padding:.4rem .7rem;font:0.72rem var(--mono);letter-spacing:.04em;cursor:pointer}
button:hover{border-color:var(--accent);color:#fff}
button.primary{border-color:var(--accent);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--subtle)}
button:disabled:hover{border-color:var(--line);color:var(--subtle)}
.deny[role="alert"]{margin:0 0 .7rem}
.hint{color:var(--subtle);font:0.72rem var(--mono);margin:.4rem 0 0}
.meter{display:flex;gap:1px;margin:0 0 1rem}
.meter i{flex:1;height:2px;background:#19191f}
.meter i.on{background:var(--accent)}
.kv{display:grid;grid-template-columns:7.5rem 1fr;gap:.2rem 0.7rem;font:0.75rem var(--mono);margin:0 0 .9rem}
.kv dt{color:var(--subtle)}
.kv dd{margin:0;word-break:break-all}
.preview,.deny{border:1px solid var(--line);padding:.55rem .65rem;margin:0 0 .7rem;font:0.75rem var(--mono)}
.deny{border-color:#3a2020;color:var(--deny)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:0.72rem var(--mono);color:var(--muted)}
.events{list-style:none;margin:0;padding:0}
.events li{display:flex;justify-content:space-between;gap:.6rem;font:0.72rem var(--mono);padding:.18rem 0;border-bottom:1px solid #121218;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:.5rem;margin:0 0 .3rem}
.list button.active{border-color:var(--accent)}
.file{border:1px solid var(--line);padding:.45rem .55rem;margin:0 0 .35rem;font:0.72rem var(--mono)}
.toast{position:fixed;right:1rem;bottom:1rem;border:1px solid var(--line);background:var(--panel);padding:.5rem .7rem;font:0.75rem var(--mono);z-index:9}
.empty{color:var(--subtle);font:0.75rem var(--mono)}
.cli{margin-top:1.2rem;color:var(--subtle);font:0.72rem var(--mono)}
@media (max-width:980px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>IMPERIUM</strong>
  <span>workbench · projector for web/v0 · session scratch only</span>
</header>
<main>
  <section>
    <h2>Source</h2>
    <label for="nl">sentence</label>
    <textarea id="nl">Echo this message: ping</textarea>
    <p class="hint">Echo / Write / Read / Append / List / Fetch · ⌘/Ctrl+Enter compiles</p>
    <div class="row">
      <button type="button" class="primary" id="btn-compile">Compile</button>
      <button type="button" id="btn-propose">Propose</button>
      <button type="button" id="btn-mic" title="Dictate into the sentence box">Hold to talk</button>
    </div>
    <label for="policy">policy.imp (session)</label>
    <textarea id="policy" placeholder="# optional"></textarea>
    <p class="hint" id="policy-lint">loading kernel…</p>
  </section>
  <section>
    <h2>Gauntlet</h2>
    <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="detail"><p class="empty">No intent. Compile a canonical sentence.</p></div>
  </section>
  <section>
    <h2>Session</h2>
    <ul class="list" id="intent-list"></ul>
    <h2>Scratch</h2>
    <div id="scratch-list"></div>
    <p class="cli">Ledger, schedules, keychain, MCP — CLI only.</p>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script type="module">
  import("./app.js").catch((err) => {
    const el = document.getElementById("detail");
    const lint = document.getElementById("policy-lint");
    const msg = err && err.message ? err.message : String(err);
    if (lint) lint.textContent = "kernel failed to load";
    if (el) el.innerHTML = `<p class="deny">${msg}. Serve from web/workbench over http://127.0.0.1 — not file://. Need app.js and kernel.js next to index.html.</p>`;
  });
</script>
</body>
</html>
